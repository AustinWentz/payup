<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PayUp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PayUp">
<meta name="theme-color" content="#ff2d2d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
<style>
:root{--red:#ff2d2d;--ink:#111;--yel:#ffe600;--paper:#fff8dc;--grn:#00c853;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--red)}
body{margin:0;background:var(--red);color:var(--ink);font:600 16px/1.3 -apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:14px}
h1,h2,.big,button,.tag{font-family:Impact,"Arial Narrow Bold","Haettenschweiler",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
h1{font-size:64px;line-height:.9;margin:6px 0 2px;color:var(--yel);text-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}
.sub{color:#fff;font-weight:800;margin:0 0 14px}
.card{background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px;margin-bottom:18px}
.bal{background:var(--yel)}
.big{font-size:38px;line-height:1;margin:0 0 6px}
.quip{margin:0 0 12px}
h2{font-size:26px;margin:0 0 10px}
label{display:block;font-weight:800;margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password]{width:100%;font:inherit;font-size:18px;padding:10px;border:3px solid var(--ink);background:#fff;border-radius:0}
input[type=date]{display:block;min-width:0;max-width:100%;min-height:48px;text-align:left;line-height:normal;-webkit-appearance:none;appearance:none}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
input[type=date]::-webkit-datetime-edit{padding:0}
input[type=date],
input[type=date]::-webkit-date-and-time-value,
input[type=date]::-webkit-datetime-edit,
input[type=date]::-webkit-datetime-edit-fields-wrapper,
input[type=date]::-webkit-datetime-edit-text,
input[type=date]::-webkit-datetime-edit-month-field,
input[type=date]::-webkit-datetime-edit-day-field,
input[type=date]::-webkit-datetime-edit-year-field{
  color:var(--ink);
  -webkit-text-fill-color:var(--ink);
}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:12px 6px;border:3px solid var(--ink);background:#fff;font-weight:800}
.seg input:checked+span{background:var(--ink);color:var(--yel)}
.seg input:focus-visible+span{outline:3px solid var(--red);outline-offset:2px}
button{font-size:22px;padding:12px 16px;border:4px solid var(--ink);background:var(--ink);color:var(--yel);cursor:pointer;border-radius:0;box-shadow:4px 4px 0 var(--red)}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--red)}
button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
button[disabled]{opacity:.4}
.full{width:100%;margin-top:14px}
.piper{background:var(--red);color:#fff;box-shadow:4px 4px 0 var(--ink);width:100%;font-size:28px}
.ghost{background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:16px;padding:6px 10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-top:3px dashed var(--ink)}
.row:first-of-type{border-top:0}
.amt{font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:24px;white-space:nowrap}
.meta{font-size:14px;opacity:.8;font-weight:700}
.acts{display:flex;gap:6px;margin-top:6px}
.settle .amt{color:var(--grn)}
.empty{font-weight:800;text-align:center;padding:10px 0}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.foot button{flex:1}
.note{font-size:14px;margin:10px 0 0;font-weight:700}
.err{color:var(--red);font-weight:800;min-height:1.3em;margin:8px 0 0}
[hidden]{display:none!important}
/* Pay the Piper: tactical nuke sequence */
.wrap{transform-origin:50% 40%;transition:scale 1.2s cubic-bezier(.1,.8,.2,1),rotate 1.2s,filter 1.2s,opacity 1.2s}
.wrap.blown{scale:2.4;rotate:6deg;filter:blur(18px) brightness(2);opacity:0}
.wrap.nkshake{animation:nkshake .12s linear infinite}
@keyframes nkshake{0%{translate:0 0}20%{translate:calc(var(--s)*-1px) calc(var(--s)*1px)}40%{translate:calc(var(--s)*1px) calc(var(--s)*-1px)}60%{translate:calc(var(--s)*-1px) calc(var(--s)*-1px)}80%{translate:calc(var(--s)*1px) calc(var(--s)*1px)}100%{translate:0 0}}
#nuke{position:fixed;inset:0;z-index:50;display:none;place-items:center;text-align:center;background:rgba(17,17,17,.6)}
#nuke.on{display:grid}
#nuke::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,var(--red) 120%);opacity:0;animation:nkpulse .5s infinite alternate}
@keyframes nkpulse{to{opacity:.9}}
#nkWarn,#nkCount{position:relative;font-family:Impact,"Arial Narrow Bold","Haettenschweiler",sans-serif;text-transform:uppercase;color:var(--yel);text-shadow:4px 4px 0 var(--ink)}
#nkWarn{font-size:clamp(28px,8vw,48px);animation:nkblink .5s steps(2) infinite}
@keyframes nkblink{50%{opacity:.3}}
#nkCount{font-size:clamp(160px,55vw,320px);line-height:.9;text-shadow:8px 8px 0 var(--ink)}
#nkCount.tick{animation:nktick .9s ease-out}
@keyframes nktick{0%{transform:scale(1.5);opacity:.3}100%{transform:scale(1);opacity:1}}
#nkRing{position:fixed;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:12px solid #fff;opacity:0;pointer-events:none;z-index:60}
#nkFlash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
#nkAfter{position:fixed;inset:0;z-index:55;display:none;place-items:center;text-align:center;background:var(--ink);padding:20px}
#nkAfter.on{display:grid}
#nkAfter h2{font-size:clamp(40px,12vw,72px);line-height:.95;margin:0 0 8px;color:var(--yel);text-shadow:4px 4px 0 var(--red)}
#nkAfter p{color:#fff;margin:0 0 20px}
@media (prefers-reduced-motion:reduce){.wrap.nkshake{animation:none}#nuke::before{animation:none;opacity:.5}#nkWarn{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>PayUp</h1>
<p class="sub">Money talks. Yours is overdue.</p>
<section class="card" id="authCard" hidden>
<h2>Show Your ID</h2>
<label for="email">Email</label>
<input type="email" id="email" autocomplete="username">
<label for="pw">Password</label>
<input type="password" id="pw" autocomplete="current-password">
<p class="err" id="authErr"></p>
<button class="full" id="signin">Let Me In</button>
</section>
<div id="app" hidden>
<p class="err" id="syncErr"></p>
<section class="card bal" aria-live="polite">
<p class="big" id="balLine"></p>
<p class="quip" id="balQuip"></p>
<button class="piper" id="settle">Pay the Piper</button>
</section>
<section class="card">
<h2 id="formTitle">Log the Damage</h2>
<label for="desc">What did you blow money on?</label>
<input type="text" id="desc" placeholder="Tacos. Again." autocomplete="off">
<label for="amount">How much? (be honest)</label>
<input type="number" id="amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
<label>Who got stuck with the bill?</label>
<div class="seg" id="paidBy">
<label><input type="radio" name="paid" value="A" checked><span>Austin</span></label>
<label><input type="radio" name="paid" value="K"><span>Keeley</span></label>
</div>
<label>How we're splitting this mess</label>
<div class="seg" id="split">
<label><input type="radio" name="split" value="50" checked><span>50/50<br>Fair. Boring.</span></label>
<label><input type="radio" name="split" value="65"><span>65/35<br>Austin carries</span></label>
</div>
<label for="date">Date of the crime</label>
<input type="date" id="date">
<p class="err" id="err"></p>
<button class="full" id="save">Log It, No Takebacks</button>
<button class="full ghost" id="cancel" hidden>Never Mind, Coward</button>
</section>
<section class="card">
<h2>The Receipts</h2>
<div id="list"></div>
</section>
<section class="card">
<h2>Don't Lose Your Stuff</h2>
<div class="foot">
<button id="export">Hoard a Backup</button>
<button id="importBtn">Resurrect Data</button>
<button id="uploadLocal" hidden>Upload Old Phone Data</button>
<button id="signout" class="ghost">Sign Out</button>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<p class="note" id="backupNote"></p>
</section>
</div>
</div>
<div id="nuke" role="alertdialog" aria-live="assertive" aria-label="Tactical nuke countdown"><div><div id="nkWarn">Tactical nuke inbound</div><div id="nkCount">10</div></div></div>
<div id="nkRing"></div>
<div id="nkFlash"></div>
<div id="nkAfter"><div><h2>Paid in full.</h2><p>Everything else was vaporized.</p><button id="nkReset">Rebuild</button></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

var firebaseConfig={
  apiKey: "AIzaSyB8rVL8sOJu8Ka_aGrqwSEXvcIlHffFUiM",
  authDomain: "payup-5cc7a.firebaseapp.com",
  projectId: "payup-5cc7a",
  storageBucket: "payup-5cc7a.firebasestorage.app",
  messagingSenderId: "692508371545",
  appId: "1:692508371545:web:453b8a61a65aa56c10df48"
};
 
(function(){
var KEY='payup.v1', PREF_KEY='payup.prefs', NAMES={A:'Austin',K:'Keeley'};
var state={items:[],lastBackup:null,last:{paid:'A',split:'50'}};
var editId=null,unsub=null,db=null,auth=null;
var $=function(id){return document.getElementById(id)};
// Storage layer: prefs stay on this device; expenses live in Firestore ("entries").
function load(){
try{var r=localStorage.getItem(PREF_KEY)||localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&s.last)state.last=s.last;if(s&&s.lastBackup)state.lastBackup=s.lastBackup}}catch(e){}
}
function save(){try{localStorage.setItem(PREF_KEY,JSON.stringify({lastBackup:state.lastBackup,last:state.last}))}catch(e){}}
function localItems(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');return s&&Array.isArray(s.items)?s.items:[]}catch(e){return[]}}
function put(it){return setDoc(doc(db,'entries',String(it.id)),it).catch(fail)}
function remove(id){return deleteDoc(doc(db,'entries',String(id))).catch(fail)}
function fail(e){$('syncErr').textContent=e&&e.code==='permission-denied'?'This account isn’t allowed to touch the data.':'Sync problem: '+(e&&e.code||e)}
function writeAll(list){
var chunks=[];for(var i=0;i<list.length;i+=400)chunks.push(list.slice(i,i+400));
return chunks.reduce(function(p,c){return p.then(function(){var b=writeBatch(db);c.forEach(function(it){b.set(doc(db,'entries',String(it.id)),it)});return b.commit()})},Promise.resolve());
}
function money(c){return '$'+(Math.abs(c)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function austinShare(it){return Math.round(it.cents*(it.split==='65'?0.65:0.5))}
// Positive = Keeley owes Austin.
function balance(){
var n=0;
state.items.forEach(function(it){
if(it.type==='settle'){n+= it.from==='K'? -it.cents : it.cents}
else{
var a=austinShare(it),k=it.cents-a;
n+= it.paid==='A'? k : -a;
}
});
return n;
}
function renderBalance(){
var b=balance(),line=$('balLine'),quip=$('balQuip'),btn=$('settle');
if(b===0){line.textContent='All square.';quip.textContent='Nobody owes nobody. Suspicious. Go spend some money.';btn.disabled=true;return}
var debtor=b>0?'Keeley':'Austin',cred=b>0?'Austin':'Keeley';
line.textContent=debtor+' owes '+cred+' '+money(b)+'.';
quip.textContent=b>0?'Cough it up, Keeley.':'Pay up, Austin. Don’t make it weird.';
btn.disabled=false;
}
function renderList(){
var box=$('list');box.innerHTML='';
if(!state.items.length){var e=document.createElement('p');e.className='empty';e.textContent='Zero expenses. Too clean. Log something.';box.appendChild(e);return}
var items=state.items.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
items.forEach(function(it){
var row=document.createElement('div');row.className='row'+(it.type==='settle'?' settle':'');
var left=document.createElement('div');
var t=document.createElement('div');t.textContent=it.type==='settle'?'PIPER PAID':it.desc;
var m=document.createElement('div');m.className='meta';
m.textContent=it.type==='settle'
? NAMES[it.from]+' paid '+NAMES[it.to]+' · '+it.date
: NAMES[it.paid]+' paid · '+(it.split==='65'?'65/35':'50/50')+' · '+it.date;
left.appendChild(t);left.appendChild(m);
var acts=document.createElement('div');acts.className='acts';
if(it.type!=='settle'){
var ed=document.createElement('button');ed.className='ghost';ed.textContent='Fix It';
ed.onclick=function(){startEdit(it.id)};acts.appendChild(ed);
}
var del=document.createElement('button');del.className='ghost';del.textContent='Yeet';
del.onclick=function(){if(confirm('Yeet this into the void? No takebacks.')){if(editId===it.id)resetForm();remove(it.id)}};
acts.appendChild(del);left.appendChild(acts);
var amt=document.createElement('div');amt.className='amt';amt.textContent=money(it.cents);
row.appendChild(left);row.appendChild(amt);box.appendChild(row);
});
}
function renderBackup(){
var n=$('backupNote');
$('uploadLocal').hidden=!localItems().length;
if(!state.lastBackup){n.textContent='You have never backed up. Bold. Reckless. Fix it.';return}
var days=Math.floor((Date.now()-state.lastBackup)/864e5);
n.textContent=days<1?'Backed up today. Look at you.':'Last backup: '+days+' day'+(days===1?'':'s')+' ago.'+(days>30?' Do it again. Now.':'');
}
function render(){renderBalance();renderList();renderBackup()}
function radio(name,val){var r=document.querySelector('input[name="'+name+'"][value="'+val+'"]');if(r)r.checked=true}
function getRadio(name){return document.querySelector('input[name="'+name+'"]:checked').value}
function resetForm(){
editId=null;$('desc').value='';$('amount').value='';$('date').value=today();$('err').textContent='';
radio('paid',state.last.paid);radio('split',state.last.split);
$('formTitle').textContent='Log the Damage';$('save').textContent='Log It, No Takebacks';$('cancel').hidden=true;
}
function startEdit(id){
var it=state.items.filter(function(x){return x.id===id})[0];if(!it)return;
editId=id;$('desc').value=it.desc;$('amount').value=(it.cents/100).toFixed(2);$('date').value=it.date;
radio('paid',it.paid);radio('split',it.split);
$('formTitle').textContent='Fix Your Mess';$('save').textContent='Save the Fix';$('cancel').hidden=false;
window.scrollTo({top:$('desc').getBoundingClientRect().top+window.scrollY-120,behavior:'smooth'});
}
$('save').onclick=function(){
var desc=$('desc').value.trim(),amt=parseFloat($('amount').value),date=$('date').value;
if(!desc){$('err').textContent='Spent it on WHAT? Add a description.';return}
if(!(amt>0)){$('err').textContent='Enter an actual amount, genius.';return}
if(!date)date=today();
var cents=Math.round(amt*100),paid=getRadio('paid'),split=getRadio('split');
if(editId){
var old=state.items.filter(function(x){return x.id===editId})[0];
if(old)put(Object.assign({},old,{desc:desc,cents:cents,paid:paid,split:split,date:date}));
}else{
put({id:Date.now(),type:'expense',desc:desc,cents:cents,paid:paid,split:split,date:date});
}
state.last={paid:paid,split:split};save();resetForm();
};
$('cancel').onclick=resetForm;
// ---- Pay the Piper: tactical nuke sequence ----
var NUKE_SRC='tactical-nuke.mp3';   // audio file, same folder as index.html
var NUKE_SECS=5.6;                  // seconds into the clip where the blast hits; the countdown ends here (nudge +/-0.1 to fine-tune sync)
var NUKE_BOOM=false;                // the clip has its own blast; set true to layer a synthesized boom on top
var nuking=false,actx=null,nukeAudio=null,wrap=document.querySelector('.wrap');
var reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function shake(px){wrap.style.setProperty('--s',px);wrap.classList.toggle('nkshake',px>0&&!reduceMotion)}
function setCount(n){var c=$('nkCount');c.textContent=n;c.classList.remove('tick');void c.offsetWidth;c.classList.add('tick')}
function boom(){
if(!NUKE_BOOM||!actx)return;
try{
var t=actx.currentTime,len=actx.sampleRate*3,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
var src=actx.createBufferSource();src.buffer=buf;
var lp=actx.createBiquadFilter();lp.type='lowpass';
lp.frequency.setValueAtTime(6000,t);lp.frequency.exponentialRampToValueAtTime(120,t+2.5);
var ng=actx.createGain();ng.gain.setValueAtTime(1,t);ng.gain.exponentialRampToValueAtTime(0.001,t+3);
src.connect(lp);lp.connect(ng);ng.connect(actx.destination);src.start(t);
var sub=actx.createOscillator(),sg=actx.createGain();
sub.frequency.setValueAtTime(90,t);sub.frequency.exponentialRampToValueAtTime(22,t+2);
sg.gain.setValueAtTime(1.2,t);sg.gain.exponentialRampToValueAtTime(0.001,t+2.5);
sub.connect(sg);sg.connect(actx.destination);sub.start(t);sub.stop(t+3);
}catch(e){}
}
function nuke(done){
nuking=true;
var n=Math.ceil(NUKE_SECS),t0=null,a=new Audio(NUKE_SRC);nukeAudio=a;
document.documentElement.style.overflow='hidden';
try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}
$('nuke').classList.add('on');setCount(n);shake(1);
function go(){if(t0===null){t0=performance.now();loop()}}
function loop(){
var rem=NUKE_SECS-(performance.now()-t0)/1000;
if(rem<=0)return detonate();
var c=Math.ceil(rem);
if(c!==n){n=c;setCount(n);shake(1+(Math.ceil(NUKE_SECS)-n)*1.8)}
requestAnimationFrame(loop);
}
function detonate(){
boom();shake(28);$('nuke').classList.remove('on');
var fl=$('nkFlash'),ring=$('nkRing');
fl.style.transition='none';fl.style.opacity=1;
ring.style.transition='none';ring.style.opacity=1;ring.style.transform='scale(1)';
requestAnimationFrame(function(){requestAnimationFrame(function(){
fl.style.transition='opacity 2.2s ease-out';fl.style.opacity=0;
ring.style.transition='transform 1.4s ease-out,opacity 1.4s ease-out';ring.style.transform='scale(70)';ring.style.opacity=0;
wrap.classList.add('blown');
})});
done();
setTimeout(function(){shake(10)},600);
setTimeout(function(){shake(0)},1800);
setTimeout(function(){$('nkAfter').classList.add('on')},1500);
}
a.addEventListener('playing',go);
var p=a.play();if(p&&p.catch)p.catch(go);   // if audio is blocked or missing, the countdown still runs silently
}
$('nkReset').onclick=function(){
if(nukeAudio){nukeAudio.pause();nukeAudio=null}
$('nkAfter').classList.remove('on');wrap.classList.remove('blown');
document.documentElement.style.overflow='';nuking=false;window.scrollTo(0,0);
};
$('settle').onclick=function(){
if(nuking)return;
var b=balance();if(b===0)return;
var from=b>0?'K':'A',to=b>0?'A':'K';
if(!confirm(NAMES[from]+' pays '+NAMES[to]+' '+money(b)+' and the slate goes clean. No takebacks. Proceed?'))return;
nuke(function(){
put({id:Date.now(),type:'settle',cents:Math.abs(b),from:from,to:to,date:today()});
});
};
$('export').onclick=function(){
var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
var url=URL.createObjectURL(blob),a=document.createElement('a');
a.href=url;a.download='payup-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(url)},2000);
state.lastBackup=Date.now();save();renderBackup();
};
$('importBtn').onclick=function(){$('importFile').click()};
$('importFile').onchange=function(e){
var f=e.target.files[0];if(!f)return;
var r=new FileReader();
r.onload=function(){
try{
var s=JSON.parse(r.result);
if(!s||!Array.isArray(s.items))throw 0;
var good=s.items.filter(function(x){return x&&x.id&&typeof x.cents==='number'});
if(!confirm('This ADDS '+good.length+' backup items to the shared list (matching ones get overwritten). Send it?'))return;
writeAll(good).catch(fail);
}catch(x){alert('That file is garbage. Try a real PayUp backup.')}
};
r.readAsText(f);e.target.value='';
};
$('uploadLocal').onclick=function(){
var li=localItems();if(!li.length)return;
if(!confirm('Upload '+li.length+' item(s) saved on this device to the shared cloud list?'))return;
writeAll(li).then(function(){alert('Uploaded. Check the Receipts.')}).catch(fail);
};
// Auth + live sync
load();
var cfgOk=firebaseConfig.apiKey&&firebaseConfig.apiKey.indexOf('PASTE')!==0;
if(!cfgOk){$('authCard').hidden=false;$('authErr').textContent='Firebase config missing: paste your firebaseConfig into index.html.';$('signin').disabled=true;return}
var fbApp=initializeApp(firebaseConfig);
auth=getAuth(fbApp);
db=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
function doSignIn(){
$('authErr').textContent='';
signInWithEmailAndPassword(auth,$('email').value.trim().toLowerCase(),$('pw').value).then(function(){$('pw').value=''}).catch(function(e){
$('authErr').textContent=/invalid-credential|wrong-password|user-not-found|invalid-email/.test(e.code)?'Wrong email or password.':'Sign-in failed: '+e.code;
});
}
$('signin').onclick=doSignIn;
$('pw').onkeydown=function(e){if(e.key==='Enter')doSignIn()};
$('signout').onclick=function(){signOut(auth)};
onAuthStateChanged(auth,function(user){
if(unsub){unsub();unsub=null}
state.items=[];
if(!user){$('app').hidden=true;$('authCard').hidden=false;return}
$('authCard').hidden=true;$('app').hidden=false;$('syncErr').textContent='';
resetForm();render();
unsub=onSnapshot(collection(db,'entries'),function(snap){
state.items=snap.docs.map(function(d){return d.data()});$('syncErr').textContent='';render();
},fail);
});
})();
</script>
</body>
</html>
